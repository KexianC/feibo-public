<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字人在线克隆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 1px solid #e9ecef;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .response-section {
            grid-column: 1 / -1;
            margin-top: 20px;
        }

        .response-content {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #34495e;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-info {
            background: #e8f5e8;
            border: 1px solid #4caf50;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error-info {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 数字人在线克隆</h1>
            <p>提交训练视频，创建你的数字人</p>
        </div>

        <div class="content">
            <div class="section" style="grid-column: 1 / -1;">
                <h2>🔐 合成接口鉴权</h2>
                <p id="authStatus" role="status">正在读取本机合成接口配置...</p>
                <div class="checkbox-group" style="margin-top: 15px;">
                    <input type="checkbox" id="previewOnly">
                    <label for="previewOnly">只预览请求（不调用接口，不消耗额度）</label>
                </div>
                <small>默认真实调用。填写训练视频和数字人名称后，点击“提交克隆任务”创建数字人；页面打开时不会自动提交。</small>
            </div>
            <!-- 数字人克隆任务提交 -->
            <div class="section">
                <h2>📤 数字人克隆任务提交</h2>
                <form id="cloneForm">
                    <div class="form-group">
                        <label for="videoUrl">训练视频URL *</label>
                        <input type="url" id="videoUrl" name="videoUrl" required 
                               placeholder="https://example.com/video.mp4">
                        <small>视频时长需控制在3-5分钟，包含音频信息，人脸需全程出现</small>
                    </div>

                    <div class="form-group">
                        <label for="avatarName">数字人名称 *</label>
                        <input type="text" id="avatarName" name="avatarName" required 
                               placeholder="请输入数字人名称">
                    </div>

                    <button type="submit" class="btn">🚀 提交克隆任务</button>
                </form>
            </div>

            <!-- 任务状态查询 -->
            <div class="section">
                <h2>🔍 任务状态查询</h2>
                <form id="statusForm">
                    <div class="form-group">
                        <label for="taskId">任务ID *</label>
                        <input type="text" id="taskId" name="taskId" required 
                               placeholder="请输入任务ID">
                    </div>
                    <button type="submit" class="btn btn-secondary">📊 查询状态</button>
                </form>

                <div id="statusResult" style="margin-top: 20px;"></div>
            </div>

            <!-- 响应结果显示 -->
            <div class="section response-section">
                <h2>📋 API响应结果</h2>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在处理请求...</p>
                </div>
                <div class="response-content" id="responseContent">等待API调用...</div>
            </div>
        </div>
    </div>

    <script>
        // 本地测试页从 Git 忽略目录加载合成凭据，不将密钥写回前端源码。
        const API_CONFIG = {
            baseUrl: 'https://openman.weta365.com/metaman/open'
        };
        let authConfigPromise;

        function loadAuthConfig() {
            if (!authConfigPromise) {
                authConfigPromise = new Promise((resolve, reject) => {
                    if (window.location.protocol !== 'file:') {
                        reject(new Error('请使用本机文件方式打开此测试页，以读取本地私有鉴权配置。'));
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = '../.local-config/digital-human-clone.credentials.js';
                    script.onload = () => {
                        const config = window.DIGITAL_HUMAN_CLONE_AUTH;
                        delete window.DIGITAL_HUMAN_CLONE_AUTH;
                        script.remove();
                        if (typeof config?.appKey !== 'string' || !config.appKey.trim()
                            || typeof config?.appSecret !== 'string' || !config.appSecret.trim()) {
                            reject(new Error('本地合成接口 appKey 或 appSecret 未配置，已阻止发送请求。'));
                            return;
                        }
                        resolve(Object.freeze({
                            appKey: config.appKey.trim(),
                            appSecret: config.appSecret.trim()
                        }));
                    };
                    script.onerror = () => {
                        script.remove();
                        reject(new Error('未能加载本地合成接口鉴权配置，已阻止发送请求。'));
                    };
                    document.head.appendChild(script);
                });
            }
            return authConfigPromise;
        }

        /**
         * MD5加密函数 - 浏览器兼容版本
         * @param {string} str - 需要加密的字符串
         * @returns {string} MD5哈希值
         */
        function md5(str) {
            // 左旋转函数
            function rotateLeft(value, amount) {
                return (value << amount) | (value >>> (32 - amount));
            }

            // 无符号加法
            function addUnsigned(x, y) {
                return ((x & 0x7FFFFFFF) + (y & 0x7FFFFFFF)) ^ (x & 0x80000000) ^ (y & 0x80000000);
            }

            // MD5核心函数
            function md5cmn(q, a, b, x, s, t) {
                return addUnsigned(rotateLeft(addUnsigned(addUnsigned(a, q), addUnsigned(x, t)), s), b);
            }

            function md5ff(a, b, c, d, x, s, t) {
                return md5cmn((b & c) | ((~b) & d), a, b, x, s, t);
            }

            function md5gg(a, b, c, d, x, s, t) {
                return md5cmn((b & d) | (c & (~d)), a, b, x, s, t);
            }

            function md5hh(a, b, c, d, x, s, t) {
                return md5cmn(b ^ c ^ d, a, b, x, s, t);
            }

            function md5ii(a, b, c, d, x, s, t) {
                return md5cmn(c ^ (b | (~d)), a, b, x, s, t);
            }

            // 字符串转换为字数组
            function convertToWordArray(str) {
                const wordArray = [];
                const messageLength = str.length;
                const numberOfWords = (((messageLength + 8) >>> 6) + 1) * 16;
                
                for (let i = 0; i < numberOfWords; i++) {
                    wordArray[i] = 0;
                }
                
                for (let i = 0; i < messageLength; i++) {
                    wordArray[i >>> 2] |= (str.charCodeAt(i) & 0xFF) << ((i % 4) * 8);
                }
                
                wordArray[messageLength >>> 2] |= 0x80 << ((messageLength % 4) * 8);
                wordArray[numberOfWords - 2] = messageLength * 8;
                
                return wordArray;
            }

            // 字转换为十六进制
            function wordToHex(value) {
                let hex = '';
                for (let i = 0; i <= 3; i++) {
                    const byte = (value >>> (i * 8)) & 0xFF;
                    hex += ('0' + byte.toString(16)).slice(-2);
                }
                return hex;
            }

            // 与 Java 后端的 StandardCharsets.UTF_8 保持一致。
            const utf8 = Array.from(new TextEncoder().encode(str), byte => String.fromCharCode(byte)).join('');
            const x = convertToWordArray(utf8);
            let a = 0x67452301;
            let b = 0xEFCDAB89;
            let c = 0x98BADCFE;
            let d = 0x10325476;

            for (let i = 0; i < x.length; i += 16) {
                const olda = a;
                const oldb = b;
                const oldc = c;
                const oldd = d;

                a = md5ff(a, b, c, d, x[i + 0], 7, 0xD76AA478);
                d = md5ff(d, a, b, c, x[i + 1], 12, 0xE8C7B756);
                c = md5ff(c, d, a, b, x[i + 2], 17, 0x242070DB);
                b = md5ff(b, c, d, a, x[i + 3], 22, 0xC1BDCEEE);
                a = md5ff(a, b, c, d, x[i + 4], 7, 0xF57C0FAF);
                d = md5ff(d, a, b, c, x[i + 5], 12, 0x4787C62A);
                c = md5ff(c, d, a, b, x[i + 6], 17, 0xA8304613);
                b = md5ff(b, c, d, a, x[i + 7], 22, 0xFD469501);
                a = md5ff(a, b, c, d, x[i + 8], 7, 0x698098D8);
                d = md5ff(d, a, b, c, x[i + 9], 12, 0x8B44F7AF);
                c = md5ff(c, d, a, b, x[i + 10], 17, 0xFFFF5BB1);
                b = md5ff(b, c, d, a, x[i + 11], 22, 0x895CD7BE);
                a = md5ff(a, b, c, d, x[i + 12], 7, 0x6B901122);
                d = md5ff(d, a, b, c, x[i + 13], 12, 0xFD987193);
                c = md5ff(c, d, a, b, x[i + 14], 17, 0xA679438E);
                b = md5ff(b, c, d, a, x[i + 15], 22, 0x49B40821);

                a = md5gg(a, b, c, d, x[i + 1], 5, 0xF61E2562);
                d = md5gg(d, a, b, c, x[i + 6], 9, 0xC040B340);
                c = md5gg(c, d, a, b, x[i + 11], 14, 0x265E5A51);
                b = md5gg(b, c, d, a, x[i + 0], 20, 0xE9B6C7AA);
                a = md5gg(a, b, c, d, x[i + 5], 5, 0xD62F105D);
                d = md5gg(d, a, b, c, x[i + 10], 9, 0x02441453);
                c = md5gg(c, d, a, b, x[i + 15], 14, 0xD8A1E681);
                b = md5gg(b, c, d, a, x[i + 4], 20, 0xE7D3FBC8);
                a = md5gg(a, b, c, d, x[i + 9], 5, 0x21E1CDE6);
                d = md5gg(d, a, b, c, x[i + 14], 9, 0xC33707D6);
                c = md5gg(c, d, a, b, x[i + 3], 14, 0xF4D50D87);
                b = md5gg(b, c, d, a, x[i + 8], 20, 0x455A14ED);
                a = md5gg(a, b, c, d, x[i + 13], 5, 0xA9E3E905);
                d = md5gg(d, a, b, c, x[i + 2], 9, 0xFCEFA3F8);
                c = md5gg(c, d, a, b, x[i + 7], 14, 0x676F02D9);
                b = md5gg(b, c, d, a, x[i + 12], 20, 0x8D2A4C8A);

                a = md5hh(a, b, c, d, x[i + 5], 4, 0xFFFA3942);
                d = md5hh(d, a, b, c, x[i + 8], 11, 0x8771F681);
                c = md5hh(c, d, a, b, x[i + 11], 16, 0x6D9D6122);
                b = md5hh(b, c, d, a, x[i + 14], 23, 0xFDE5380C);
                a = md5hh(a, b, c, d, x[i + 1], 4, 0xA4BEEA44);
                d = md5hh(d, a, b, c, x[i + 4], 11, 0x4BDECFA9);
                c = md5hh(c, d, a, b, x[i + 7], 16, 0xF6BB4B60);
                b = md5hh(b, c, d, a, x[i + 10], 23, 0xBEBFBC70);
                a = md5hh(a, b, c, d, x[i + 13], 4, 0x289B7EC6);
                d = md5hh(d, a, b, c, x[i + 0], 11, 0xEAA127FA);
                c = md5hh(c, d, a, b, x[i + 3], 16, 0xD4EF3085);
                b = md5hh(b, c, d, a, x[i + 6], 23, 0x04881D05);
                a = md5hh(a, b, c, d, x[i + 9], 4, 0xD9D4D039);
                d = md5hh(d, a, b, c, x[i + 12], 11, 0xE6DB99E5);
                c = md5hh(c, d, a, b, x[i + 15], 16, 0x1FA27CF8);
                b = md5hh(b, c, d, a, x[i + 2], 23, 0xC4AC5665);

                a = md5ii(a, b, c, d, x[i + 0], 6, 0xF4292244);
                d = md5ii(d, a, b, c, x[i + 7], 10, 0x432AFF97);
                c = md5ii(c, d, a, b, x[i + 14], 15, 0xAB9423A7);
                b = md5ii(b, c, d, a, x[i + 5], 21, 0xFC93A039);
                a = md5ii(a, b, c, d, x[i + 12], 6, 0x655B59C3);
                d = md5ii(d, a, b, c, x[i + 3], 10, 0x8F0CCC92);
                c = md5ii(c, d, a, b, x[i + 10], 15, 0xFFEFF47D);
                b = md5ii(b, c, d, a, x[i + 1], 21, 0x85845DD1);
                a = md5ii(a, b, c, d, x[i + 8], 6, 0x6FA87E4F);
                d = md5ii(d, a, b, c, x[i + 15], 10, 0xFE2CE6E0);
                c = md5ii(c, d, a, b, x[i + 6], 15, 0xA3014314);
                b = md5ii(b, c, d, a, x[i + 13], 21, 0x4E0811A1);
                a = md5ii(a, b, c, d, x[i + 4], 6, 0xF7537E82);
                d = md5ii(d, a, b, c, x[i + 11], 10, 0xBD3AF235);
                c = md5ii(c, d, a, b, x[i + 2], 15, 0x2AD7D2BB);
                b = md5ii(b, c, d, a, x[i + 9], 21, 0xEB86D391);

                a = addUnsigned(a, olda);
                b = addUnsigned(b, oldb);
                c = addUnsigned(c, oldc);
                d = addUnsigned(d, oldd);
            }

            return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
        }

        /**
         * 生成API签名
         * @param {string} timestamp - 时间戳
         * @returns {string} MD5签名
         */
        function generateSignature(timestamp, config) {
            const plainText = `${config.appKey}+${config.appSecret}+${timestamp}`;
            return md5(plainText);
        }

        /**
         * 获取API请求头
         * @returns {Promise<Object>} 包含认证信息的请求头
         */
        async function getAuthHeaders() {
            const config = await loadAuthConfig();
            const timestamp = Math.floor(Date.now() / 1000).toString();
            const signature = generateSignature(timestamp, config);
            
            return {
                'Content-Type': 'application/json',
                'appKey': config.appKey,
                'timestamp': timestamp,
                'signature': signature
            };
        }

        async function sendApiRequest(path, options, type) {
            const headers = await getAuthHeaders();
            const url = `${API_CONFIG.baseUrl}${path}`;
            if (document.getElementById('previewOnly').checked) {
                displayResponse({
                    previewOnly: true,
                    message: '仅本地预览，未发送 API 请求，不消耗额度。',
                    url,
                    method: options.method,
                    headers: {
                        ...headers,
                        appKey: '[已配置，已隐藏]',
                        signature: '[已生成，已隐藏]'
                    },
                    ...(options.body ? { body: JSON.parse(options.body) } : {})
                }, `${type}（离线预览）`);
                return null;
            }
            const response = await fetch(url, { ...options, headers });
            if (!response.ok) {
                throw new Error(`HTTP 请求失败：${response.status}`);
            }
            return response.json();
        }

        /**
         * 显示加载状态
         * @param {boolean} show - 是否显示加载状态
         */
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('show');
            } else {
                loading.classList.remove('show');
            }
        }

        /**
         * 显示API响应结果
         * @param {Object} response - API响应数据
         * @param {string} type - 请求类型
         */
        function displayResponse(response, type) {
            const responseContent = document.getElementById('responseContent');
            const timestamp = new Date().toLocaleString();
            
            const responseText = `[${timestamp}] ${type} API响应:\n${JSON.stringify(response, null, 2)}\n\n`;
            responseContent.textContent = responseText + responseContent.textContent;
        }

        /**
         * 显示错误信息
         * @param {string} error - 错误信息
         * @param {string} type - 请求类型
         */
        function displayError(error, type) {
            const responseContent = document.getElementById('responseContent');
            const timestamp = new Date().toLocaleString();
            
            const errorText = `[${timestamp}] ${type} API错误:\n${error}\n\n`;
            responseContent.textContent = errorText + responseContent.textContent;
        }

        /**
         * 提交数字人克隆任务
         * @param {FormData} formData - 表单数据
         */
        async function submitCloneTask(formData) {
            showLoading(true);
            
            try {
                const requestData = {
                    avatarType: "fixed_avatar",
                    videoUrl: formData.get('videoUrl'),
                    avatarName: formData.get('avatarName'),
                    videoBgMatting: true,
                    needAuthorized: false,
                };

                // 清理undefined值
                Object.keys(requestData).forEach(key => {
                    if (requestData[key] === undefined) {
                        delete requestData[key];
                    }
                });

                const result = await sendApiRequest('/avatar/online/clone', {
                    method: 'POST',
                    body: JSON.stringify(requestData)
                }, '数字人克隆任务提交');

                if (result === null) return;
                displayResponse(result, '数字人克隆任务提交');

                // 如果成功，自动填充任务ID到查询表单
                if (result.ok && result.data) {
                    document.getElementById('taskId').value = result.data;
                }

            } catch (error) {
                displayError(error.message, '数字人克隆任务提交');
            } finally {
                showLoading(false);
            }
        }

        /**
         * 查询任务状态
         * @param {string} taskId - 任务ID
         */
        async function queryTaskStatus(taskId) {
            showLoading(true);
            
            try {
                const result = await sendApiRequest(`/avatar/online/clone/status/${encodeURIComponent(taskId)}`, {
                    method: 'GET'
                }, '任务状态查询');

                if (result === null) return;
                displayResponse(result, '任务状态查询');

                // 显示状态信息
                displayStatusInfo(result);

            } catch (error) {
                displayError(error.message, '任务状态查询');
            } finally {
                showLoading(false);
            }
        }

        /**
         * 显示任务状态信息
         * @param {Object} result - API响应结果
         */
        function displayStatusInfo(result) {
            const statusResult = document.getElementById('statusResult');
            
            if (result.ok && result.data) {
                const data = result.data;
                let statusClass = 'status-info';
                let statusText = '';

                switch (data.cloneStatus) {
                    case 'published':
                        statusText = '✅ 克隆成功';
                        break;
                    case 'clone_ing':
                        statusText = '⏳ 克隆中...';
                        break;
                    case 'clone_fail':
                        statusText = '❌ 克隆失败';
                        statusClass = 'error-info';
                        break;
                    default:
                        statusText = `📊 状态: ${data.cloneStatus}`;
                }

                statusResult.innerHTML = `
                    <div class="${statusClass}">
                        <h4>${statusText}</h4>
                        <p><strong>任务ID:</strong> ${data.taskId}</p>
                        <p><strong>数字人名称:</strong> ${data.name}</p>
                        ${data.openApiId ? `<p><strong>数字人ID:</strong> ${data.openApiId}</p>` : ''}
                        ${data.taskDesc ? `<p><strong>任务描述:</strong> ${data.taskDesc}</p>` : ''}
                    </div>
                `;
            } else {
                statusResult.innerHTML = `
                    <div class="error-info">
                        <h4>❌ 查询失败</h4>
                        <p>${result.message || '未知错误'}</p>
                    </div>
                `;
            }
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadAuthConfig().then(() => {
                document.getElementById('authStatus').textContent = '已加载线上合成接口凭据，可以提交数字人克隆任务。';
            }).catch(error => {
                document.getElementById('authStatus').textContent = error.message;
            });
            // 克隆任务提交表单
            document.getElementById('cloneForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                submitCloneTask(formData);
            });

            // 状态查询表单
            document.getElementById('statusForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const taskId = document.getElementById('taskId').value.trim();
                if (taskId) {
                    queryTaskStatus(taskId);
                }
            });
        });
    </script>
</body>
</html>
