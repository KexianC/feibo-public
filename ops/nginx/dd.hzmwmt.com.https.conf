server {
    listen 80;
    server_name dd.hzmwmt.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/feibo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/dd.hzmwmt.com.log;
    error_log /www/wwwlogs/dd.hzmwmt.com.error.log;
}

server {
    listen 443 ssl http2;
    server_name dd.hzmwmt.com;

    root /www/wwwroot/dd.hzmwmt.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dd.hzmwmt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dd.hzmwmt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:FEIBO_SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    error_page 497 https://$host$request_uri;

    include /www/server/panel/vhost/nginx/snippets/feibo-security-headers.conf;

    location ~* \.map$ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /www/server/panel/vhost/nginx/snippets/feibo-security-headers.conf;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /www/server/panel/vhost/nginx/snippets/feibo-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    access_log /www/wwwlogs/dd.hzmwmt.com.log;
    error_log /www/wwwlogs/dd.hzmwmt.com.error.log;
}
