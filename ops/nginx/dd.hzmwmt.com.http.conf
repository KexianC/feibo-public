server {
    listen 80;
    server_name dd.hzmwmt.com;

    root /www/wwwroot/dd.hzmwmt.com/current;
    index index.html;

    access_log /www/wwwlogs/dd.hzmwmt.com.log;
    error_log /www/wwwlogs/dd.hzmwmt.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/feibo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* \.map$ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
