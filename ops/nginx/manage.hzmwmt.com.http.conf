server {
    listen 80;
    server_name manage.hzmwmt.com;

    root /www/wwwroot/manage.hzmwmt.com/current;
    index index.html;

    access_log /www/wwwlogs/manage.hzmwmt.com.log;
    error_log /www/wwwlogs/manage.hzmwmt.com.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/feibo-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /geo-agent-api {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_buffering off;
    }

    location ^~ /geo-agent-api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_buffering off;
    }

    location ~* \.map$ {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
